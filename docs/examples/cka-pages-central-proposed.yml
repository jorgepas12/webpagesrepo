# REPLACEMENT CANDIDATE for the course's existing .github/workflows/pages.yml.
# Keep the existing Pages workflow until this candidate is reviewed and approved.
# PIN the reusable workflow to a release commit SHA before merging to main.
name: Build and Deploy Jekyll via LabControl

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-build:
    permissions:
      contents: read
    uses: jorgepas12/webpagesrepo/.github/workflows/labcontrol-reusable.yml@feat/central-course-onboarding-cka
    with:
      tracking_id: ckapriv
      upload_site: true

  package-pages:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download validated static site
        uses: actions/download-artifact@v4
        with:
          name: labcontrol-validated-site
          path: _site

      - name: Package for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
