title: Netec Learning Labs
description: Plataforma de Laboratorios

# Para project site:
url: "https://netec-mx.github.io"
baseurl: "/NOMBRE_DEL_REPO"

# Nombre completo del repo (owner/repo)
repository: netec-mx/NOMBRE_DEL_REPO

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata

exclude:
  - .bundle
  - vendor
  - node_modules
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - labs/labx/

logo: /assets/img/neteclogo.png
favicon: /assets/img/favicon.ico

# =====================================================================
# LABCONTROL TRACKING
# =====================================================================
#
# URL base pública del API de LabControl.
#
# Déjala vacía mientras el sitio funcione solamente con progreso local.
#
# Ejemplo de desarrollo:
# labcontrol_api_url: "http://localhost:3101"
#
# Ejemplo futuro:
# labcontrol_api_url: "https://labs-api.ejemplo.com"
#
# IMPORTANTE:
# - No incluir "/" al final.
# - No colocar tokens ni credenciales aquí.
#
labcontrol_api_url: ""

# =====================================================================
# CONFIGURACIÓN LOCAL
# DESCOMENTAR SI TRABAJAS EN MÚLTIPLES LABS A LA VEZ
# =====================================================================

# port: 4001
# livereload_port: 35730
