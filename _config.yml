# title: Netec Learning Labs
description: Plataforma de Laboratorios · Terraform en Azure Essentials
# Para project site:
url: "https://jorgepas12.github.io"
baseurl: "/webpagesrepo"   # CLAVE para que no se rompan rutas

# Nombre completo del repo (owner/repo)
repository: #cambiar aqui

# Para local Recuerda ajustar rutas en los archivos
# url: "http://localhost:4000"
# baseurl: ""

# Si usas un tema remoto (opcional):
# remote_theme: owner/tema

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-github-metadata 

exclude:
  - .bundle
  - vendor
  - node_modules
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md

logo: /assets/img/neteclogo.png
favicon: /assets/img/favicon.ico