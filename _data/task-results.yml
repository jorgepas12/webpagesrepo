lab1:
  results:
    - "**Resultado esperado:** Terraform estará disponible desde cualquier terminal o PowerShell. No será necesario navegar manualmente al directorio para usarlo."
    - "**Resultado esperado:** Se mostrará en consola la versión actual de Terraform instalada."
lab2:
  results:
    - "**Resultado esperado:** Azure CLI autenticado correctamente y configurado con la suscripción correcta."
    - "**Resultado esperado:** Se habrá creado el archivo base de configuración de Terraform para trabajar con Azure."
    - "**Resultado esperado:** Visual Studio Code estará listo para trabajar con archivos Terraform de forma eficiente, con ayuda de resaltado de sintaxis, validación en tiempo real y autocompletado."
lab3:
  results:
    - "**Resultado Esperado:** El grupo de recursos ha sido definido correctamente en `main.tf`, con un nombre personalizado."
    - "**Resultado Esperado:** El archivo `main.tf` contiene los dos recursos declarados: un grupo de recursos y una red virtual básica con nombres únicos por estudiante."
    - "**Resultado Esperado:** El archivo `main.tf` contendrá una definición de instancia de contenedor básica, personalizada y lista para desplegar."
lab4:
  results:
    - "**Resultado Esperado:** Las variables están declaradas en el mismo archivo, y sus valores están definidos en el bloque `locals`."
    - "**Resultado Esperado:** Todos los recursos ahora utilizan las variables declaradas localmente."
lab5:
  results:
    - "**Resultado esperado:** Al ejecutar `terraform apply`, Terraform mostrará en la terminal los valores del grupo de recursos, la VNet y la URL pública del contenedor. Por el momento aun no se ejecutara `terraform apply`."
lab6:
  results:
    - "**Resultado esperado:** Terraform descarga el proveedor `azurerm` y configura el backend local. Verás el mensaje: `Terraform has been successfully initialized!`"
    - "**Resultado esperado:** La consola mostrará un resumen con los recursos que se van a crear. Ningún recurso se aplicará aún."
    - "**Resultado esperado:** Los recursos serán desplegados exitosamente en Azure. La consola mostrará los valores de salida definidos en los bloques `output`."
    - "**Resultado esperado:** Se mostrarán los nombres de los recursos y la dirección DNS del contenedor creado."
    - "**Resultado esperado:** Todos los recursos creados serán eliminados del grupo de recursos."
