# .github/workflows/pages.yml
name: Build and Deploy Jekyll

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate LabControl tooling
        run: |
          node scripts/test_lab_manifest.mjs
          node --test scripts/test_repair_step_ids.mjs
          node --test scripts/test_step_id_workflow.mjs
          node scripts/test_sync_lab_manifests.mjs
          node scripts/test_course_catalog.mjs
          node scripts/test_lab_id_registry.mjs
          node scripts/test_instructor_demo.mjs
          node scripts/test_instructor_demo_links.mjs
          node scripts/test_instructor_demo_navigation.mjs
          node scripts/test_instructor_demo_return.mjs
          node scripts/test_instructor_demo_tracker.mjs
          node scripts/test_instructor_demo_ui.mjs
          node scripts/test_lab_progress_storage.mjs
          node scripts/test_lab_tracker.mjs
          node --test scripts/test_update_existing_course_runtime.mjs
          node --test scripts/test_write_course_link_proof.mjs
          node --check assets/js/lab-demo-context.js
          node --check scripts/update_existing_course_runtime.mjs
          node --check scripts/write_course_link_proof.mjs
          node scripts/test_authoring_flow.mjs
          node --check scripts/generate_lab_manifest.mjs
          node --check scripts/generate_course_catalog.mjs
          node --check scripts/sync_lab_manifests.mjs
          node --check scripts/lab_id_registry.mjs
          node --check scripts/normalize_course_labs.mjs
          node --check scripts/test_authoring_flow.mjs
          bash -n scripts/create_labs.sh
          bash -n scripts/insert_lab.sh

      # En pushes a main se corrigen errores editoriales de IDs antes de generar
      # manifests. Nunca renumerar automáticamente un curso sincronizado con
      # Lab Control: podría romper referencias de progreso/revisiones congeladas.
      - name: Repair Step IDs safely on push
        env:
          LABCONTROL_API_URL: ${{ vars.LABCONTROL_API_URL }}
          LABCONTROL_SYNC_TOKEN: ${{ secrets.LABCONTROL_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if node scripts/repair_step_ids.mjs --check; then
            echo "Step IDs: sin cambios."
            exit 0
          fi

          if [[ -n "${LABCONTROL_API_URL}" || -n "${LABCONTROL_SYNC_TOKEN}" ]]; then
            echo "::error::Step IDs requieren corrección, pero hay configuración de Lab Control. Revisión manual obligatoria para preservar progreso histórico."
            exit 1
          fi

          echo "Curso sin configuración de sincronización: normalizando IDs de Steps..."
          node scripts/repair_step_ids.mjs --apply
          node scripts/repair_step_ids.mjs --check
          git diff --check

          git add -- labs/
          if git diff --cached --quiet; then
            echo "Sin archivos modificados tras la auditoría."
            exit 0
          fi

          # Evita escribir sobre cambios simultáneos en main.
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::main cambió mientras se ejecutaba el workflow. Reintentar con un nuevo push; no se sobrescribirá trabajo ajeno."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(labcontrol): normalizar Step IDs automáticamente"
          git push origin HEAD:main
          echo "Step IDs corregidos y guardados en main. El build continuará con la versión normalizada."

      - name: Generate LabControl course catalog
        run: |
          echo "Generating LabControl manifests..."
          node scripts/generate_lab_manifest.mjs --all

          echo "Generating public LabControl course catalog..."
          node scripts/generate_course_catalog.mjs

      - name: Sync LabControl manifests
        env:
          LABCONTROL_API_URL: ${{ vars.LABCONTROL_API_URL }}
          LABCONTROL_SYNC_TOKEN: ${{ secrets.LABCONTROL_SYNC_TOKEN }}
        run: |
          if [[ -z "${LABCONTROL_API_URL}" || -z "${LABCONTROL_SYNC_TOKEN}" ]]; then
            echo "Legacy LabControl push sync is not configured."
            echo "The public course catalog will still be published."
            exit 0
          fi

          echo "Legacy LabControl push sync is configured."
          node scripts/sync_lab_manifests.mjs --all

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
